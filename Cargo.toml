[package]
name = "hp-m177"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Scan client, CLI, native Mac GUI, and local eSCL/AirScan bridge for the HP Color LaserJet Pro MFP M177fw"
license = "MIT"
authors = ["Jens Abrahamsson"]
readme = "README.md"
default-run = "hp-m177"

[lib]
name = "hp_m177"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "hp-m177"
path = "src/bin/hp-m177.rs"

[[bin]]
name = "hp-m177-bridge"
path = "src/bin/hp-m177-bridge.rs"

[[bin]]
name = "hp-m177-fake"
path = "src/bin/hp-m177-fake.rs"

[[bin]]
name = "hp-m177-gui"
path = "src/bin/hp-m177-gui.rs"

[dependencies]
# Stay on 4.5: clap 4.6 needs edition 2024 (Cargo ≥ 1.85).
clap = { version = "~4.5.36", features = ["derive"] }
mdns-sd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
